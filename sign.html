<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>All Season — Sign Rental Contract</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#172435;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 10px 30px #10203018}.brand{font-weight:800;color:#0d2340;font-size:20px}.muted{color:#617389;font-size:13px}.review{margin:18px 0;padding:14px;border:1px solid #d7e0ea;border-radius:10px;background:#f8fbfe}.sig{border:2px dashed #8fa8c1;border-radius:10px;background:#fff;overflow:hidden;margin-top:8px}.sig canvas{width:100%;height:190px;display:block;touch-action:none}.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}button{border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#0c7bc9;color:#fff}.secondary{background:#e9eff5;color:#17324d}input{width:100%;padding:11px;border:1px solid #b7c6d7;border-radius:8px;font-size:16px}.done{text-align:center;padding:40px 10px}.error{color:#9b2727}</style></head><body><div class="wrap"><div class="card" id="card"><div class="brand">All Season Car Rental</div><p class="muted">Secure rental agreement signing</p><div id="body">Loading contract…</div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js?v=0.9.16"></script><script>(async()=>{const root=document.getElementById('body'),token=new URLSearchParams(location.search).get('token');if(!token){root.innerHTML='<p class="error">Invalid signing link.</p>';return;}const call=async payload=>{const r=await fetch(`${window.SUPABASE_URL}/functions/v1/b5-contract-signing`,{method:'POST',headers:{'Content-Type':'application/json','apikey':window.SUPABASE_ANON_KEY},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok)throw new Error(j.error||'Unable to continue');return j;};try{const d=await call({action:'view',token}),f=d.contract.form_data||{},role=d.request.signer_role;root.innerHTML=`<div class="review"><strong>Contract ${d.contract.contract_number||''}</strong><p class="muted">Please review the rental agreement details below before signing.</p><div><b>Customer:</b> ${f.customer_name||f.full_name||d.request.signer_name||'Recorded on contract'}</div><div><b>Vehicle:</b> ${f.vehicle||f.vehicle_name||f.registration||'Recorded on contract'}</div><div><b>Rental period:</b> ${f.pickup_at||f.pickup_date||''} ${f.return_at||f.return_date?'→ '+(f.return_at||f.return_date):''}</div><div class="actions"><button class="secondary" id="reviewBtn">Review Full Contract</button></div></div><label><b>${role==='management'?'Management name':'Full name of lessee'}</b></label><input id="name" value="${(d.request.signer_name||'').replaceAll('&','&amp;').replaceAll('"','&quot;')}"><p class="muted">Sign inside the box using your finger, stylus or mouse.</p><div class="sig"><canvas id="sig"></canvas></div><div class="actions"><button class="secondary" id="clear">Clear Signature</button><button class="primary" id="submit">Accept & Sign Contract</button></div><p class="muted">By selecting Accept & Sign Contract, you confirm this is your signature and that you have reviewed the agreement.</p>`;document.getElementById('reviewBtn').onclick=()=>window.open(`contract.html?signview=${encodeURIComponent(token)}`,'_blank');const c=document.getElementById('sig'),ctx=c.getContext('2d');let drawing=false,dirty=false;function size(){const r=c.getBoundingClientRect(),old=dirty?c.toDataURL():null;c.width=Math.max(600,Math.floor(r.width*2));c.height=380;ctx.lineWidth=4;ctx.lineCap='round';ctx.strokeStyle='#102236';if(old){const i=new Image();i.onload=()=>ctx.drawImage(i,0,0,c.width,c.height);i.src=old;}}size();const pos=e=>{const r=c.getBoundingClientRect(),p=e.touches?.[0]||e;return{x:(p.clientX-r.left)*c.width/r.width,y:(p.clientY-r.top)*c.height/r.height}};const start=e=>{e.preventDefault();drawing=true;dirty=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};const move=e=>{if(!drawing)return;e.preventDefault();const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()};const end=()=>drawing=false;c.addEventListener('pointerdown',start);c.addEventListener('pointermove',move);addEventListener('pointerup',end);document.getElementById('clear').onclick=()=>{ctx.clearRect(0,0,c.width,c.height);dirty=false};document.getElementById('submit').onclick=async()=>{const name=document.getElementById('name').value.trim();if(!name)return alert('Please enter your full name.');if(!dirty)return alert('Please sign inside the signature box.');if(!confirm('Submit this signature? Once submitted, it will be retained with the contract.'))return;try{await call({action:'sign',token,signer_name:name,signature:c.toDataURL('image/png')});root.innerHTML='<div class="done"><h2>Contract signed</h2><p>Your signature has been securely recorded with this rental agreement.</p><p class="muted">You may close this page.</p></div>';}catch(e){alert(e.message)}};}catch(e){root.innerHTML=`<p class="error">${e.message}</p>`;}})();</script></body></html>
